# Velo backing services (postgres + valkey).
#
#   docker compose up -d       → bare infra for local `pnpm dev`
#   Full self-hosted stack     → add the app overlay:
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up -d --build
#
# The app overlay requires secrets — copy .env.example → .env first.
# Prod (Caddy + TLS) additionally layers docker-compose.prod.yml.
#
# SECURITY (VEL-71): postgres ships a weak default password (`velo`) and valkey
# runs with NO auth — fine ONLY because their published ports are bound to
# 127.0.0.1 below, so they're reachable from THIS machine (host `psql`, `pnpm
# dev`) but NOT from the LAN. The app containers reach them over the Docker
# network by service name, independent of these host bindings. The prod overlay
# unpublishes both ports entirely (`ports: !override []`). Never rebind these to
# 0.0.0.0 (`"5432:5432"`) on a shared/exposed network without a strong password
# on postgres and `--requirepass` on valkey.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-velo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-velo}
      POSTGRES_DB: ${POSTGRES_DB:-velo_dev}
    ports:
      # Loopback-only: reachable from this host (psql, `pnpm dev`), not the LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-velo} -d ${POSTGRES_DB:-velo_dev}"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:7
    restart: unless-stopped
    ports:
      # Loopback-only: unauthenticated valkey must never be LAN-reachable.
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  valkey_data:
