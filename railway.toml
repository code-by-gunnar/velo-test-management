[build]
builder = "nixpacks"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @velo/api build"

[deploy]
startCommand = "node apps/api/dist/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
# Zero-downtime: brief overlap while new container passes health check
overlapSeconds = 10
# Give old container 5s to finish in-flight requests
drainingSeconds = 5
