# App overlay — api + web containers on top of docker-compose.yml infra.
#
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up -d --build
#
# Requires .env (copy from .env.example). Kept separate from docker-compose.yml
# so the bare-infra dev workflow needs no variables: compose interpolates the
# whole file at parse time, so the :? guards below would otherwise fire even
# when only postgres/valkey are started.

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # Published because the browser connects directly for SSE (EventSource)
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      NODE_ENV: ${API_NODE_ENV:-production}
      PORT: "3001"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Runtime connects as non-superuser velo_app so RLS actually binds (audit #19);
      # migrations/fixups use the privileged URL. velo_app is provisioned on boot.
      DATABASE_URL: postgresql://velo_app:${APP_DB_PASSWORD:?set in .env — openssl rand -hex 16}@postgres:5432/${POSTGRES_DB:-velo_dev}
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER:-velo}:${POSTGRES_PASSWORD:-velo}@postgres:5432/${POSTGRES_DB:-velo_dev}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      VALKEY_URL: redis://valkey:6379
      AUTH_SECRET: ${AUTH_SECRET:?set in .env — openssl rand -base64 32 (must match web)}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?set in .env — openssl rand -hex 32}
      # Email is optional — without SMTP_HOST the api runs in console mode
      # (OTPs/reset links print to logs, invite links surface in the UI)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      FROM_EMAIL: ${FROM_EMAIL:-Velo <velo@localhost>}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      # Optional integrations — empty disables each
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      POSTHOG_KEY: ${POSTHOG_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LINEAR_CLIENT_ID: ${LINEAR_CLIENT_ID:-}
      LINEAR_CLIENT_SECRET: ${LINEAR_CLIENT_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Migrations + schema fixups run before the server listens
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Internal URL for SSR fetches, the /api/backend gateway, and Auth.js callbacks
      API_URL: http://api:3001
      # Browser-facing API URL (SSE); also read at runtime in getServerSideProps
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:3001}
      AUTH_SECRET: ${AUTH_SECRET}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      AUTH_URL: ${WEB_URL:-http://localhost:3000}
      NEXTAUTH_URL: ${WEB_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      # OAuth — empty keeps providers registered but unusable until configured
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
