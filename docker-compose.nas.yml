# Velo — single-file NAS stack, NO ${} interpolation (edit values directly).
# For stack managers (Dockhand/Portainer/Synology) whose env fields don't feed
# compose interpolation. Just fill in the 4 CAPS placeholders below and deploy.
#
# NOTE: this is a convenience mirror of docker-compose.yml + docker-compose.app.yml
# for single-file stack managers. If you change service config in those files,
# update it here too. CLI/.env users should prefer the two split files.
#
# ┌─ EDIT THESE (find/replace all) ────────────────────────────────────────────┐
# │ 1. NAS_IP                → your NAS LAN address, e.g. 192.168.1.50          │
# │                            (appears in several URLs — replace every one)    │
# │ 2. REPLACE_APP_DB_PASS   → openssl rand -hex 16                             │
# │ 3. REPLACE_AUTH_SECRET   → openssl rand -base64 32                          │
# │ 4. REPLACE_INTERNAL_SEC  → openssl rand -hex 32                             │
# │ 5. REPLACE_MINIO_PASS    → openssl rand -hex 16  (object-storage password)  │
# │                                                                            │
# │ ⚠️  These secrets appear MORE THAN ONCE and every copy must match:         │
# │       REPLACE_AUTH_SECRET / REPLACE_INTERNAL_SEC → api + web       (2x)     │
# │       REPLACE_MINIO_PASS                         → api + minio +          │
# │                                                    minio-init      (3x)     │
# └────────────────────────────────────────────────────────────────────────────┘
#
# Storage (evidence/avatars/CI payloads) is handled by a bundled MinIO container
# below — set REPLACE_MINIO_PASS and it just works. View uploaded evidence inside
# Velo (the run/defect screens); for raw bucket access use `mc ls`. Prefer cloud
# instead? Delete the `minio` + `minio-init` services and the S3_* lines on the
# api block, then set S3_* (or R2_*) there to point at R2 / AWS S3 / B2 / Wasabi.
#
# Email is OFF by default (console mode: login codes print to the api logs).

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: velo
      POSTGRES_PASSWORD: velo
      POSTGRES_DB: velo_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velo -d velo_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:7
    restart: unless-stopped
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ghcr.io/code-by-gunnar/velo-api:beta
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3001"
      LOG_LEVEL: info
      DATABASE_URL: postgresql://velo_app:REPLACE_APP_DB_PASS@postgres:5432/velo_dev
      MIGRATION_DATABASE_URL: postgresql://velo:velo@postgres:5432/velo_dev
      APP_DB_PASSWORD: REPLACE_APP_DB_PASS
      VALKEY_URL: redis://valkey:6379
      AUTH_SECRET: REPLACE_AUTH_SECRET               # must match web
      INTERNAL_API_SECRET: REPLACE_INTERNAL_SEC      # must match web
      WEB_URL: http://NAS_IP:3000
      # Bundled object storage (evidence/avatars/CI payloads) — see minio below.
      S3_ENDPOINT: http://minio:9000                 # api -> minio (internal)
      S3_PUBLIC_ENDPOINT: http://NAS_IP:9000         # browser -> minio (MUST be the NAS IP, not localhost)
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: velo
      S3_SECRET_ACCESS_KEY: REPLACE_MINIO_PASS       # must match the minio service below
      S3_BUCKET: velo
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s   # migrations run before the server listens

  web:
    image: ghcr.io/code-by-gunnar/velo-web:beta
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:3001
      NEXT_PUBLIC_API_BASE_URL: http://NAS_IP:3001    # browser → api (SSE)
      AUTH_SECRET: REPLACE_AUTH_SECRET                # must match api
      INTERNAL_API_SECRET: REPLACE_INTERNAL_SEC       # must match api
      AUTH_URL: http://NAS_IP:3000
      NEXTAUTH_URL: http://NAS_IP:3000
      AUTH_TRUST_HOST: "true"
      # Drop idle keep-alive sockets fast so Chrome's 6-per-host connection pool
      # frees between rapid section switches — without this, navigation "stalls"
      # for seconds. Raise to ~95000 ONLY if you later front the app with a
      # reverse proxy (Caddy/Traefik/nginx) whose pooling needs long-lived upstreams.
      KEEP_ALIVE_TIMEOUT: "100"

  # Bundled S3-compatible object store — makes evidence upload work with no cloud
  # account. Only the S3 API (:9000) is published — the browser fetches presigned
  # download URLs from it, so it must be reachable on the LAN. The admin console
  # (:9001) is intentionally NOT exposed.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API (the browser fetches presigned URLs here)
    environment:
      MINIO_ROOT_USER: velo
      MINIO_ROOT_PASSWORD: REPLACE_MINIO_PASS       # must match the api S3_* creds above
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: create the bucket on boot (idempotent), then exit.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 velo REPLACE_MINIO_PASS &&
      mc mb --ignore-existing local/velo &&
      echo 'bucket ready';
      "
    restart: "no"

volumes:
  postgres_data:
  valkey_data:
  minio_data:
