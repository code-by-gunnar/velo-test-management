# Opt-in object storage — a self-contained MinIO (S3-compatible) server for
# self-hosters who don't want a cloud storage account.
#
#   docker compose -f docker-compose.yml -f docker-compose.app.yml -f docker-compose.storage.yml up -d
#
# In .env set:
#   S3_ENDPOINT=http://minio:9000            # api -> minio (internal)
#   S3_PUBLIC_ENDPOINT=http://localhost:9000 # browser -> minio (host-reachable)
#   S3_REGION=us-east-1
#   S3_ACCESS_KEY_ID=${MINIO_ROOT_USER}
#   S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
#   S3_BUCKET=velo

services:
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env — openssl rand -hex 16}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: create the bucket on boot (idempotent), then exit.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET:-velo} &&
      echo 'bucket ready';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-velo}
    restart: "no"

volumes:
  minio-data:
